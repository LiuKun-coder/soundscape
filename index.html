<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e14" />
<meta name="description" content="声屿 Soundscape — 极简白噪声。实时合成雨声、海浪、壁炉、咖啡馆、深夜林与风扇，混合播放、定时关闭，把世界调成喜欢的声音。" />
<title>声屿 Soundscape · 白噪声</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="phone" id="phone">

  <header>
    <div class="brand">
      <span class="logo">声屿 SOUNDSCAPE</span>
      <span class="slogan">把世界调成喜欢的声音</span>
    </div>
    <button class="timer-btn" id="timerBtn" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
      <span id="timerLabel">无限</span>
    </button>
  </header>

  <div class="dial-wrap">
    <div class="dial" id="dial" role="button" tabindex="0" aria-label="播放或暂停全部声音">
      <div class="ring"><svg viewBox="0 0 120 120">
        <circle class="track" cx="60" cy="60" r="57"/>
        <circle class="value" cx="60" cy="60" r="57" stroke-dasharray="358.1" stroke-dashoffset="0" id="ringVal"/>
      </svg></div>
      <div class="big-emoji" id="dialEmoji">🌧️</div>
      <div class="name" id="dialName">雨声</div>
      <div class="sub" id="dialSub">未播放 · 点击开始</div>
      <div class="fab" id="fab" role="button" tabindex="0" aria-label="暂停所有声音">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.4"/><rect x="14" y="5" width="4" height="14" rx="1.4"/></svg>
      </div>
    </div>
  </div>

  <div class="sounds" id="sounds"></div>

  <footer>
    <div class="now-playing">
      <span class="np-emoji" id="npEmoji">🌧️</span>
      <div class="np-text">
        <div class="t1" id="npTitle">雨声</div>
        <div class="t2" id="npSub">混合 1 种声音</div>
      </div>
    </div>
    <button class="solo-btn" id="soloBtn" title="只保留一个大声音">DSP</button>
  </footer>

  <!-- 定时面板 -->
  <div class="sheet" id="sheet" role="dialog" aria-label="定时关闭">
    <div class="mask" id="sheetMask"></div>
    <div class="panel">
      <h3>定时关闭</h3>
      <div class="hint" id="sheetHint">到时声音会缓缓淡出，陪你入睡</div>
      <div class="opts" id="sheetOpts"></div>
    </div>
  </div>
</div>

<script src="js/sounds.js"></script>
<script src="js/app.js"></script>
</body>
</html>
